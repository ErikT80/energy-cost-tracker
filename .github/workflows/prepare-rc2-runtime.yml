name: Prepare RC2 runtime changes

on:
  push:
    branches:
      - release/v0.1.0-rc.2

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: release/v0.1.0-rc.2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Apply prepared changes
        run: python scripts/prepare_rc2_runtime.py

      - name: Run tests
        run: |
          python -m pip install -r requirements-test.txt
          python -m pytest -q
          python -m compileall -q custom_components/energy_cost_tracker

      - name: Commit prepared runtime changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-rc2-runtime.yml scripts/prepare_rc2_runtime.py
          git add custom_components/energy_cost_tracker/runtime.py tests/test_runtime_tariffs.py
          git diff --cached --check
          git commit -m "Fix tariff boundary handling for RC2"
          git push origin HEAD:release/v0.1.0-rc.2

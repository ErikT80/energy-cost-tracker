name: Prepare RC2 release metadata

on:
  push:
    branches:
      - release/v0.1.0-rc.2

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: release/v0.1.0-rc.2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Apply RC2 release metadata
        run: python scripts/prepare_rc2_release.py

      - name: Validate RC2 candidate
        run: |
          python -m pip install -r requirements-test.txt
          bash scripts/check.sh

      - name: Commit RC2 release changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-rc2-release.yml scripts/prepare_rc2_release.py
          git add custom_components/energy_cost_tracker/manifest.json custom_components/energy_cost_tracker/const.py README.md CHANGELOG.md .github/workflows/release.yml
          git diff --cached --check
          git commit -m "Prepare v0.1.0-rc.2 release"
          git push origin HEAD:release/v0.1.0-rc.2
